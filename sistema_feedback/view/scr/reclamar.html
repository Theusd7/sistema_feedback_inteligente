<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Reclamação - FeedSmart</title>
    <link rel="stylesheet" href="reclamar.css">
</head>
<body>

<header>
    <div class="logo">FeedSmart</div>

    <nav>
        <a href="principal.html">Início</a>
        <a href="#">Reclamar</a>
        <a href="login.html" class="btn-login">Login Empresa</a>
    </nav>
</header>

<main>
    <div class="form-container">
        <h2>Enviar Reclamação / Feedback</h2>

        <input type="text" placeholder="Seu nome (opcional)">

        <input type="email" placeholder="Seu e-mail (opcional)">

        <select>
            <option>-- Escolha a empresa --</option>
            <option>Loja Exemplo</option>
            <option>Delivery Rápido</option>
            <option>SPA Beleza</option>
        </select>

        <div class="nota-container">
            <label>Nota: 1</label>
            <input type="range" min="1" max="5" value="1">
        </div>

        <textarea placeholder="Conte a sua experiência"></textarea>

        <div class="botoes-form">
            <button class="btn-enviar">Enviar</button>
            <button class="btn-limpar">Limpar</button>
        </div>
    </div>
</main>

</body>
</html>
