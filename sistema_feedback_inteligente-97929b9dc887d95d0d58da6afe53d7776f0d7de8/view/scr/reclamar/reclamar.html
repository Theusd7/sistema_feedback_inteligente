<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Reclamação - FeedSmart</title>
    <link rel="stylesheet" href="reclamar.css">
</head>

<body>

    <header>
        <div class="logo">FeedSmart</div>

        <nav>
            <a href="../principal/principal.html">Início</a>
            <a href="#">Reclamar</a>
            <a href="../login/login.html" class="btn-login">Login Empresa</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Enviar Reclamação / Feedback</h2>

            <input type="text" placeholder="Seu nome (opcional)">

            <input type="email" placeholder="Seu e-mail (opcional)">

            <select>
                <option>-- Escolha a empresa --</option>
                <option>Loja Exemplo</option>
                <option>Delivery Rápido</option>
                <option>SPA Beleza</option>
            </select>

            <div class="nota-container">
                <label>Nota: 1</label>
                <input type="range" min="1" max="5" value="1">
            </div>

            <textarea placeholder="Conte a sua experiência"></textarea>

            <div class="botoes-form">
                <button class="btn-enviar">Enviar</button>
                <button class="btn-limpar">Limpar</button>
            </div>
        </div>
    </main>
    <script>
        document.getElementById("formFeedback").addEventListener("submit", async (e) => {
            e.preventDefault();

            const titulo = document.getElementById("titulo").value;
            const descricao = document.getElementById("descricao").value;
            const nota = document.getElementById("nota").value;

            try {
                const res = await fetch("http://127.0.0.1:3000/feedbacks", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        titulo,
                        descricao,
                        nota,
                        usuario_id: 1,
                        empresa_id: 1
                    })
                });

                if (res.ok) {
                    alert("Feedback enviado!");
                } else {
                    alert("Erro ao enviar");
                }

            } catch (err) {
                console.log(err);
                alert("Erro");
            }
        });
    </script>
</body>

</html>
